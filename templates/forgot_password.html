<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layan — نسيت كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f3460;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(212,175,55,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%);
    padding: 1.5rem;
  }
  .wrapper { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:1.5rem; }
  .logo { height:80px; background:white; border-radius:14px; padding:6px 16px; object-fit:contain; }
  .logo-fallback { font-size:2rem; font-weight:900; color:#d4af37; letter-spacing:2px; display:none; }
  .card { width:100%; background:white; border-radius:18px; padding:2.2rem 2rem; box-shadow:0 20px 60px rgba(0,0,0,0.35); }
  .card-title { font-size:1.1rem; font-weight:700; color:#0f3460; margin-bottom:0.5rem; text-align:center; }
  .card-desc { font-size:0.87rem; color:#6b7280; text-align:center; margin-bottom:1.5rem; line-height:1.6; }
  .form-label { display:block; font-size:0.85rem; font-weight:600; color:#374151; margin-bottom:0.4rem; }
  .input-wrap { position:relative; margin-bottom:1.2rem; }
  .input-wrap .bi { position:absolute; right:0.85rem; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none; }
  .form-control {
    width:100%; padding:0.65rem 2.4rem 0.65rem 0.9rem;
    border:1.5px solid #e5e7eb; border-radius:10px;
    font-family:'Cairo',sans-serif; font-size:0.9rem; color:#111;
    outline:none; transition:border-color 0.2s; direction:ltr; text-align:left;
  }
  .form-control:focus { border-color:#0f3460; box-shadow:0 0 0 3px rgba(15,52,96,0.1); }
  .alert { border-radius:10px; padding:0.65rem 0.9rem; font-size:0.85rem; font-weight:600;
           margin-bottom:1rem; display:none; align-items:center; gap:0.5rem; }
  .alert.error  { background:#fff0f0; border:1px solid #fecaca; color:#991b1b; }
  .alert.show   { display:flex; }
  .btn {
    width:100%; padding:0.75rem; background:#0f3460; color:white; border:none;
    border-radius:10px; font-family:'Cairo',sans-serif; font-size:0.95rem; font-weight:700;
    cursor:pointer; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:0.5rem;
  }
  .btn:hover { background:#1a4a7a; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .back-link { text-align:center; margin-top:1rem; font-size:0.85rem; }
  .back-link a { color:#0f3460; font-weight:600; text-decoration:none; }
  .footer { color:rgba(255,255,255,0.35); font-size:0.75rem; text-align:center; }
</style>
</head>
<body>
<div class="wrapper">
  <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
    <img src="/static/logo.png" alt="Layan" class="logo"
         onerror="this.style.display='none';document.getElementById('lt').style.display='block'">
    <div id="lt" class="logo-fallback">LAYAN</div>
  </div>
  <div class="card">
    <div class="card-title"><i class="bi bi-envelope-fill" style="color:#d4af37;margin-left:0.4rem;"></i>نسيت كلمة المرور</div>
    <div class="card-desc">أدخل بريدك الإلكتروني وسنرسل لك رمز التحقق (OTP) فوراً</div>
    <div id="err" class="alert error"><i class="bi bi-exclamation-circle-fill"></i><span id="err-text"></span></div>
    <label class="form-label">البريد الإلكتروني</label>
    <div class="input-wrap">
      <i class="bi bi-envelope-fill"></i>
      <input id="email" type="email" class="form-control" placeholder="storeq620@gmail.com" autocomplete="email">
    </div>
    <button id="btn" class="btn" onclick="submit()">
      <i class="bi bi-send-fill"></i> إرسال رمز التحقق
    </button>
    <div class="back-link"><a href="/login"><i class="bi bi-arrow-right"></i> العودة لتسجيل الدخول</a></div>
  </div>
  <div class="footer">Layan · نظام إدارة المتجر · جميع الحقوق محفوظة</div>
</div>
<script>
async function submit() {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('err');
  errEl.classList.remove('show');
  if (!email) { document.getElementById('err-text').textContent='أدخل البريد الإلكتروني'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري الإرسال...';
  try {
    const r = await fetch('/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const d = await r.json();
    if (d.ok) { window.location.href = '/verify-otp'; }
    else { document.getElementById('err-text').textContent = d.error||'حدث خطأ'; errEl.classList.add('show'); btn.disabled=false; btn.innerHTML='<i class="bi bi-send-fill"></i> إرسال رمز التحقق'; }
  } catch { document.getElementById('err-text').textContent='خطأ في الاتصال'; errEl.classList.add('show'); btn.disabled=false; btn.innerHTML='<i class="bi bi-send-fill"></i> إرسال رمز التحقق'; }
}
document.addEventListener('DOMContentLoaded', () => document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') submit(); }));
</script>
</body>
</html>
