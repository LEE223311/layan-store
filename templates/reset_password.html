<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layan — إعادة تعيين كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f3460;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(212,175,55,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%);
    padding: 1.5rem;
  }
  .wrapper { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:1.5rem; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:0.5rem; }
  .logo { height:80px; width:auto; background:white; border-radius:14px; padding:6px 16px; object-fit:contain; }
  .logo-fallback { font-size:2rem; font-weight:900; color:#d4af37; letter-spacing:2px; }
  .card { width:100%; background:white; border-radius:18px; padding:2.2rem 2rem; box-shadow:0 20px 60px rgba(0,0,0,0.35); }
  .card-title { font-size:1.1rem; font-weight:700; color:#0f3460; margin-bottom:1.4rem; text-align:center; }
  .form-group { margin-bottom:1.1rem; }
  .form-label { display:block; font-size:0.85rem; font-weight:600; color:#374151; margin-bottom:0.4rem; }
  .input-wrap { position:relative; }
  .input-wrap .bi-icon { position:absolute; right:0.85rem; top:50%; transform:translateY(-50%); color:#9ca3af; pointer-events:none; }
  .toggle-pw { position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9ca3af; padding:0; }
  .form-control {
    width:100%; padding:0.65rem 2.4rem 0.65rem 2.4rem;
    border:1.5px solid #e5e7eb; border-radius:10px;
    font-family:'Cairo',sans-serif; font-size:0.9rem; color:#111;
    outline:none; transition:border-color 0.2s;
  }
  .form-control:focus { border-color:#0f3460; box-shadow:0 0 0 3px rgba(15,52,96,0.1); }
  .alert { border-radius:10px; padding:0.65rem 0.9rem; font-size:0.85rem; font-weight:600; margin-bottom:1rem; display:none; align-items:center; gap:0.5rem; }
  .alert.error { background:#fff0f0; border:1px solid #fecaca; color:#991b1b; }
  .alert.success { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
  .alert.show { display:flex; }
  .btn-primary {
    width:100%; padding:0.75rem; background:#0f3460; color:white; border:none; border-radius:10px;
    font-family:'Cairo',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:0.5rem; margin-top:0.4rem;
  }
  .btn-primary:hover { background:#1a4a7a; }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
  .back-link { text-align:center; margin-top:1rem; font-size:0.85rem; color:#6b7280; }
  .back-link a { color:#0f3460; font-weight:600; text-decoration:none; }
  .footer { color:rgba(255,255,255,0.35); font-size:0.75rem; text-align:center; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="brand">
    <img src="/static/logo.png" alt="Layan" class="logo"
         onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'">
    <div id="logo-text" class="logo-fallback" style="display:none;">LAYAN</div>
  </div>
  <div class="card">
    {% if expired %}
    <div style="text-align:center;">
      <i class="bi bi-exclamation-triangle-fill" style="font-size:3rem;color:#f59e0b;"></i>
      <h3 style="margin:1rem 0 0.5rem;color:#0f3460;">الرابط منتهي الصلاحية</h3>
      <p style="color:#6b7280;font-size:0.9rem;margin-bottom:1.5rem;">هذا الرابط غير صالح أو انتهت صلاحيته. يرجى طلب رابط جديد.</p>
      <a href="/forgot-password" style="display:inline-block;padding:0.7rem 1.5rem;background:#0f3460;color:white;border-radius:10px;text-decoration:none;font-weight:700;">
        طلب رابط جديد
      </a>
    </div>
    {% else %}
    <div class="card-title">
      <i class="bi bi-shield-lock-fill" style="color:#d4af37;margin-left:0.4rem;"></i>
      إعادة تعيين كلمة المرور
    </div>
    <div id="alert-error" class="alert error"><i class="bi bi-exclamation-circle-fill"></i><span id="err-text"></span></div>
    <div id="alert-success" class="alert success"><i class="bi bi-check-circle-fill"></i><span>تم تغيير كلمة المرور بنجاح</span></div>
    <div id="form-area">
      <div class="form-group">
        <label class="form-label">كلمة المرور الجديدة</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill bi-icon"></i>
          <input id="pw1" type="password" class="form-control" placeholder="6 أحرف على الأقل">
          <button type="button" class="toggle-pw" onclick="togglePw('pw1','eye1')"><i class="bi bi-eye-slash" id="eye1"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">تأكيد كلمة المرور</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill bi-icon"></i>
          <input id="pw2" type="password" class="form-control" placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePw('pw2','eye2')"><i class="bi bi-eye-slash" id="eye2"></i></button>
        </div>
      </div>
      <button id="submit-btn" class="btn-primary" onclick="submitReset()">
        <i class="bi bi-check-lg"></i> حفظ كلمة المرور الجديدة
      </button>
      <div class="back-link"><a href="/login"><i class="bi bi-arrow-right"></i> العودة لتسجيل الدخول</a></div>
    </div>
    {% endif %}
  </div>
  <div class="footer">Layan · نظام إدارة المتجر · جميع الحقوق محفوظة</div>
</div>
<script>
const TOKEN = "{{ token }}";
function togglePw(id, eyeId) {
  const inp = document.getElementById(id);
  const eye = document.getElementById(eyeId);
  if (inp.type === 'password') { inp.type = 'text'; eye.className = 'bi bi-eye'; }
  else { inp.type = 'password'; eye.className = 'bi bi-eye-slash'; }
}
async function submitReset() {
  const pw1   = document.getElementById('pw1').value;
  const pw2   = document.getElementById('pw2').value;
  const errEl = document.getElementById('alert-error');
  const okEl  = document.getElementById('alert-success');
  const btn   = document.getElementById('submit-btn');
  errEl.classList.remove('show'); okEl.classList.remove('show');
  if (!pw1 || !pw2) { document.getElementById('err-text').textContent='أدخل كلمة المرور'; errEl.classList.add('show'); return; }
  if (pw1 !== pw2) { document.getElementById('err-text').textContent='كلمتا المرور غير متطابقتين'; errEl.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري الحفظ...';
  try {
    const r = await fetch(`/reset-password/${TOKEN}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({new_password: pw1})
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('form-area').style.display = 'none';
      okEl.classList.add('show');
      setTimeout(() => window.location.href = '/login', 2000);
    } else {
      document.getElementById('err-text').textContent = d.error || 'حدث خطأ';
      errEl.classList.add('show');
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg"></i> حفظ كلمة المرور الجديدة';
    }
  } catch {
    document.getElementById('err-text').textContent = 'خطأ في الاتصال';
    errEl.classList.add('show');
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg"></i> حفظ كلمة المرور الجديدة';
  }
}
</script>
</body>
</html>
