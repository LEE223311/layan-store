<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layan — رمز التحقق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f3460;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(212,175,55,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%);
    padding: 1.5rem;
  }
  .wrapper { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:1.5rem; }
  .logo { height:80px; background:white; border-radius:14px; padding:6px 16px; object-fit:contain; }
  .logo-fallback { font-size:2rem; font-weight:900; color:#d4af37; letter-spacing:2px; display:none; }
  .card { width:100%; background:white; border-radius:18px; padding:2.2rem 2rem; box-shadow:0 20px 60px rgba(0,0,0,0.35); }
  .card-title { font-size:1.1rem; font-weight:700; color:#0f3460; margin-bottom:0.5rem; text-align:center; }
  .card-desc { font-size:0.87rem; color:#6b7280; text-align:center; margin-bottom:1.8rem; line-height:1.6; }
  .otp-inputs { display:flex; gap:0.6rem; justify-content:center; margin-bottom:1.5rem; direction:ltr; }
  .otp-box {
    width:48px; height:56px; text-align:center; font-size:1.5rem; font-weight:700;
    border:2px solid #e5e7eb; border-radius:10px; outline:none; color:#0f3460;
    font-family:'Cairo',sans-serif; transition:border-color 0.2s;
  }
  .otp-box:focus { border-color:#0f3460; box-shadow:0 0 0 3px rgba(15,52,96,0.1); }
  .otp-box.filled { border-color:#d4af37; background:#fffbf0; }
  .alert { border-radius:10px; padding:0.65rem 0.9rem; font-size:0.85rem; font-weight:600;
           margin-bottom:1rem; display:none; align-items:center; gap:0.5rem; }
  .alert.error  { background:#fff0f0; border:1px solid #fecaca; color:#991b1b; }
  .alert.show   { display:flex; }
  .btn {
    width:100%; padding:0.75rem; background:#0f3460; color:white; border:none;
    border-radius:10px; font-family:'Cairo',sans-serif; font-size:0.95rem; font-weight:700;
    cursor:pointer; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:0.5rem;
  }
  .btn:hover { background:#1a4a7a; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .timer { text-align:center; font-size:0.85rem; color:#6b7280; margin-top:1rem; }
  .timer span { color:#0f3460; font-weight:700; }
  .resend-link { text-align:center; margin-top:0.5rem; font-size:0.85rem; }
  .resend-link a { color:#0f3460; font-weight:600; text-decoration:none; }
  .back-link { text-align:center; margin-top:0.8rem; font-size:0.85rem; }
  .back-link a { color:#6b7280; text-decoration:none; }
  .footer { color:rgba(255,255,255,0.35); font-size:0.75rem; text-align:center; }
</style>
</head>
<body>
<div class="wrapper">
  <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
    <img src="/static/logo.png" alt="Layan" class="logo"
         onerror="this.style.display='none';document.getElementById('lt').style.display='block'">
    <div id="lt" class="logo-fallback">LAYAN</div>
  </div>
  <div class="card">
    <div class="card-title"><i class="bi bi-shield-check" style="color:#d4af37;margin-left:0.4rem;font-size:1.3rem;"></i>رمز التحقق</div>
    <div class="card-desc">تم إرسال رمز مكون من 6 أرقام إلى بريدك الإلكتروني<br>أدخله أدناه خلال <span id="timer-inline" style="color:#0f3460;font-weight:700;">10:00</span></div>
    <div id="err" class="alert error"><i class="bi bi-exclamation-circle-fill"></i><span id="err-text"></span></div>
    <div class="otp-inputs">
      <input class="otp-box" id="o1" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" id="o2" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" id="o3" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" id="o4" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" id="o5" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" id="o6" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <button id="btn" class="btn" onclick="submitOtp()">
      <i class="bi bi-check-circle-fill"></i> تحقق من الرمز
    </button>
    <div class="resend-link"><a href="/forgot-password">إعادة إرسال الرمز</a></div>
    <div class="back-link"><a href="/login"><i class="bi bi-arrow-right"></i> العودة لتسجيل الدخول</a></div>
  </div>
  <div class="footer">Layan · نظام إدارة المتجر · جميع الحقوق محفوظة</div>
</div>
<script>
// OTP boxes navigation
const boxes = ['o1','o2','o3','o4','o5','o6'];
boxes.forEach((id, i) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    el.value = el.value.replace(/[^0-9]/g,'');
    el.classList.toggle('filled', el.value !== '');
    if (el.value && i < 5) document.getElementById(boxes[i+1]).focus();
    if (getOtp().length === 6) submitOtp();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0) document.getElementById(boxes[i-1]).focus();
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
    paste.split('').forEach((ch, j) => {
      if (boxes[j]) { document.getElementById(boxes[j]).value = ch; document.getElementById(boxes[j]).classList.add('filled'); }
    });
    if (paste.length === 6) submitOtp();
  });
});

function getOtp() { return boxes.map(id => document.getElementById(id).value).join(''); }

// Countdown timer - 10 minutes
let secs = 600;
const timerEl = document.getElementById('timer-inline');
const interval = setInterval(() => {
  secs--;
  const m = String(Math.floor(secs/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
  if (secs <= 0) { clearInterval(interval); timerEl.textContent = '00:00'; timerEl.style.color='#dc2626'; }
}, 1000);

async function submitOtp() {
  const otp = getOtp();
  const errEl = document.getElementById('err');
  errEl.classList.remove('show');
  if (otp.length < 6) { document.getElementById('err-text').textContent='أدخل الرمز كاملاً (6 أرقام)'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري التحقق...';
  try {
    const r = await fetch('/verify-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({otp})
    });
    const d = await r.json();
    if (d.ok) { window.location.href = '/reset-password'; }
    else {
      document.getElementById('err-text').textContent = d.error || 'الرمز غير صحيح';
      errEl.classList.add('show');
      boxes.forEach(id => { document.getElementById(id).value=''; document.getElementById(id).classList.remove('filled'); });
      document.getElementById('o1').focus();
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> تحقق من الرمز';
    }
  } catch {
    document.getElementById('err-text').textContent = 'خطأ في الاتصال';
    errEl.classList.add('show');
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> تحقق من الرمز';
  }
}
document.getElementById('o1').focus();
</script>
</body>
</html>
